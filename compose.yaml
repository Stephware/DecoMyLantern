services:
  backend:
    build:
      context: ./src/backend/DecoMyLantern.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__KnownNetwork: 172.16.0.0/12
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING in .env}
      Invitations__EncryptionKey: ${INVITATION_ENCRYPTION_KEY:?Set stable INVITATION_ENCRYPTION_KEY in .env}
      StoryRenderer__Url: http://story-renderer:7070
      StoryRenderer__SharedSecret: ${STORY_RENDERER_SECRET:?Set STORY_RENDERER_SECRET in .env}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5050}:8080"

  story-renderer:
    build:
      context: .
      dockerfile: story-renderer/Dockerfile
    restart: unless-stopped
    environment:
      STORY_RENDERER_SECRET: ${STORY_RENDERER_SECRET:?Set STORY_RENDERER_SECRET in .env}
      STORY_RENDERER_MODE: ${STORY_RENDERER_MODE:-ffmpeg}
      STORY_RENDERER_TIMEOUT_MS: ${STORY_RENDERER_TIMEOUT_MS:-240000}
      PORT: "7070"
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    # Not published: only the backend can reach the private render service.

  frontend:
    build:
      context: ./src/frontend
      args:
        VITE_ADS_ENABLED: ${ADS_ENABLED:-true}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - caddy
    restart: unless-stopped
    profiles:
      - tunnel
