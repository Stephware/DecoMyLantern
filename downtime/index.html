<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17372c">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="BeMyParol is temporarily unavailable. Please check back in a little while.">
  <title>We'll shine again | BeMyParol</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 8% 6%, #fffdf7 0, #f7f1e7 41%, #f2e7d9 100%);
      color: #273e31;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    .wrap { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    header { padding: 28px 0 14px; }
    .brand {
      display: inline-flex; align-items: center; gap: 12px;
      color: #273e31; font-family: Georgia, "Times New Roman", serif;
      text-decoration: none; font-size: 23px; font-weight: 700; letter-spacing: -.035em;
    }
    .brand-mark {
      width: 39px; height: 39px; display: grid; place-items: center;
      border-radius: 12px; color: #f6d38c; background: #264535;
      font-family: Georgia, serif; font-size: 28px; line-height: 1;
      border: 1px solid #ad8a4f;
    }
    main {
      flex: 1; display: grid; align-items: center;
      padding: 26px 0 50px;
    }
    .panel {
      position: relative; overflow: hidden;
      display: grid; grid-template-columns: minmax(0, 1.04fr) minmax(0, .96fr);
      align-items: center; gap: clamp(18px, 4vw, 54px);
      padding: clamp(26px, 5vw, 66px);
      border: 1px solid #bd9b69;
      border-radius: 30px;
      background: radial-gradient(ellipse at 83% 30%, #315441 0, #203f31 43%, #152b24 100%);
      color: #fff8e9;
      box-shadow: 0 24px 70px rgba(43, 53, 39, .18);
      isolation: isolate;
    }
    .panel::after {
      content: ""; position: absolute; inset: 13px; border: 1px solid rgba(248, 213, 140, .23);
      border-radius: 21px; pointer-events: none; z-index: -1;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 9px;
      color: #f0d39b; text-transform: uppercase; letter-spacing: .16em;
      font-size: 11px; font-weight: 750; line-height: 1.5;
    }
    .eyebrow::before { content: ""; width: 18px; height: 1px; background: #dcad69; }
    h1 {
      max-width: 560px; margin: 20px 0 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 4.9vw, 65px); font-weight: 600;
      letter-spacing: -.042em; line-height: 1.09; text-wrap: balance;
    }
    h1 em { color: #f3ca82; font-weight: 500; font-style: normal; }
    .message { max-width: 460px; margin: 0; color: #e9e8dd; font-size: clamp(15px, 1.4vw, 17px); line-height: 1.8; }
    .actions { margin-top: 30px; display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
    .retry {
      display: inline-flex; justify-content: center; align-items: center; min-height: 48px;
      padding: 12px 27px; border-radius: 12px; background: #f4dfb2; color: #572831;
      text-decoration: none; font-weight: 750; font-size: 15px;
      box-shadow: 0 7px 24px rgba(0,0,0,.14);
    }
    .retry:hover, .retry:focus-visible { background: #fff0d4; }
    .retry:focus-visible, .brand:focus-visible { outline: 3px solid #f6d38c; outline-offset: 4px; }
    .hint { color: #e0d2b6; font-size: 13px; }
    .art {
      position: relative; display: grid; place-items: center;
      width: min(100%, 460px); margin: 0 auto; aspect-ratio: 1;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,.25));
    }
    .art::before {
      content: ""; position: absolute; inset: 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(241,191,102,.31) 0%, rgba(241,191,102,.12) 42%, transparent 71%);
    }
    .art svg { position: relative; width: 100%; height: auto; overflow: visible; transform: scale(1.47); }
    footer { padding: 0 0 26px; text-align: center; color: #786e61; font-size: 13px; }
    footer span { color: #995044; }
    @media (max-width: 760px) {
      header { padding-top: 18px; }
      main { padding: 14px 0 28px; }
      .panel { grid-template-columns: 1fr; gap: 0; text-align: center; padding: 27px 22px 34px; }
      .art { order: -1; width: min(76vw, 288px); margin-bottom: 8px; }
      .copy { display: flex; flex-direction: column; align-items: center; }
      h1 { margin-top: 13px; font-size: clamp(34px, 8vw, 46px); }
      .eyebrow { letter-spacing: .11em; }
      .actions { justify-content: center; gap: 12px; margin-top: 22px; }
    }
    @media (max-width: 390px) {
      .wrap { width: calc(100% - 24px); }
      .panel { padding: 24px 17px 28px; border-radius: 23px; }
      .panel::after { inset: 8px; border-radius: 16px; }
      .retry { width: 100%; }
    }
  </style>
</head>
